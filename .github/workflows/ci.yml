name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run release checks
        run: ./scripts/check_release.sh
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install package builders
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build all release formats
        run: ./scripts/build_release.sh
      - name: Verify archives and native packages
        shell: bash
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          unzip -t open_hardware_control_v*.zip
          unzip -t "Entwicklerpaket "*.zip
          tar -tzf open-hardware-control-*-source.tar.gz >/dev/null
          dpkg-deb --info open-hardware-control_*_all.deb >/dev/null
          rpm -qpl open-hardware-control-*.noarch.rpm >/dev/null
