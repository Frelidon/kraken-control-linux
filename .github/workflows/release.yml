name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check release
        run: ./scripts/check_release.sh
      - name: Build release assets
        run: ./scripts/build_release.sh "${GITHUB_REF_NAME#v}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/RELEASE_NOTES_v${VERSION}.md"
          if [[ -f "$NOTES" ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Kraken Control $GITHUB_REF_NAME" \
              --notes-file "$NOTES" \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Kraken Control $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
